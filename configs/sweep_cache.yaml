# Cache-fraction sweep (blueprint 17.4): fixed D=128 standard table, targeted policies.
profile: sweep_cache
data:
  rows: 1000000
  dimensions: 128
  seed: 42
  output_dir: artifacts/data/standard
cache:
  capacity: 100000
  policy: adaptive
limits:
  max_history_ids: 256
  max_batch_requests: 64
  max_batch_ids: 16384
  queue_capacity: 1024
  max_batch_delay_ms: 2.0
benchmark:
  scenarios: [stable, abrupt]
  policies: [no_cache, static, lru, adaptive]
  baselines: []
  microbatch_sizes: [16]
  cache_fractions: [0.01, 0.05, 0.10, 0.25]
  history_length: 32
  requests: 50000
  repeats: 3
