[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hotshift"
version = "0.1.0"
description = "A reproducible embedding cache and recommendation serving demonstration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]
service = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cpu", "cuda", "integration", "slow", "benchmark"]

