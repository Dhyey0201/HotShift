services:
  api:
    build: .
    environment:
      HOTSHIFT_BACKEND: cpu
      HOTSHIFT_CONFIG: configs/demo.yaml
      HOTSHIFT_DATA_DIR: /app/artifacts/data/demo
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
  frontend:
    image: node:22-alpine
    working_dir: /workspace/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      HOTSHIFT_API_PROXY: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/workspace/frontend
    depends_on:
      api:
        condition: service_healthy
