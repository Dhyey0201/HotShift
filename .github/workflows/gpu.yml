name: Manual GPU validation

on:
  workflow_dispatch:

jobs:
  cuda:
    runs-on: [self-hosted, linux, x64, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev,service]'
      - run: python scripts/preflight.py --backend cuda
      - run: python -m hotshift.cli data generate --config configs/smoke.yaml
      - run: python -m hotshift.cli data catalog --config configs/smoke.yaml
      - run: python -m hotshift.cli build-extension
      - run: python -m pytest tests/cpu tests/integration tests/cuda
      - run: bash scripts/run_sanitizers.sh
      - run: python -m hotshift.cli bench-cuda --matrix configs/smoke.yaml --smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hotshift-gpu-validation
          path: |
            artifacts/runs/**
            artifacts/sanitizers/**
          if-no-files-found: ignore
