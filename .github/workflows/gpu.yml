name: Manual GPU validation

# Runs only when dispatched by a maintainer on an explicitly configured, trusted self-hosted
# GPU runner. It never triggers on pull requests, so untrusted code cannot reach the runner.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "quick (gates + smoke) or full (all benchmarks, hours)"
        default: quick

permissions:
  contents: read

jobs:
  cuda:
    runs-on: [self-hosted, linux, x64, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -e '.[dev,service]'
      - run: bash scripts/gpu_evidence.sh ${{ inputs.mode == 'full' && '' || '--quick' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hotshift-gpu-evidence
          path: artifacts/hotshift-gpu-evidence-*.tar.gz
          if-no-files-found: warn
