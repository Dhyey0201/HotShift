name: Manual GPU validation

on:
  workflow_dispatch:

jobs:
  cuda:
    runs-on: [self-hosted, linux, x64, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev,service]'
      - run: python scripts/preflight.py --backend cuda
      - run: python -m hotshift.cli build-extension
      - run: python -m pytest tests/cuda -m cuda
      - run: bash scripts/run_sanitizers.sh
