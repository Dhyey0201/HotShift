name: CPU foundation

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e '.[dev,service]'
      - run: python scripts/preflight.py --backend cpu
      - run: python -m hotshift.cli data generate --config configs/smoke.yaml
      - run: python -m hotshift.cli data catalog --config configs/smoke.yaml
      - run: python -m hotshift.cli test-reference --config configs/smoke.yaml
      - run: python -m pytest tests/cpu tests/integration
      - run: npm install --prefix frontend
      - run: npm run test --prefix frontend
      - run: npm run build --prefix frontend

