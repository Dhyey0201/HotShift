name: CPU foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements/cpu-py311-linux.lock
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check src tests scripts
      - run: python scripts/preflight.py --backend cpu
      - run: python -m hotshift.cli data generate --config configs/smoke.yaml
      - run: python -m hotshift.cli data catalog --config configs/smoke.yaml
      - run: python -m hotshift.cli test-reference --config configs/smoke.yaml
      # CUDA modules skip here and the run prints a GPU SKIP SUMMARY; this job never claims GPU coverage.
      - run: python -m pytest tests -q
      - run: python -m hotshift.cli bench --matrix configs/smoke.yaml --smoke

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements/cpu-py311-linux.lock && python -m pip install --no-deps -e .
      - run: npm ci --prefix frontend
      - run: npm run test --prefix frontend
      - run: npm run build --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm run test:e2e --prefix frontend
        env:
          CI: "1"
          HOTSHIFT_PYTHON: python
